<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orima Labs</title>
<meta name="description" content="Orima Labs — coming soon.">
<meta name="theme-color" content="#F5F1EA">
<meta property="og:title" content="Orima Labs">
<meta property="og:description" content="Coming soon.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M16.62 51.26 A33.4 33.4 0 1 1 48.74 83.38' fill='none' stroke='%231C1915' stroke-width='28' stroke-linecap='round'/%3E%3Ccircle cx='21.72' cy='78.28' r='9.5' fill='%23E2604C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #F5F1EA;
    color: #1C1915;
    font-family: Nunito, ui-rounded, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    min-height: 100vh;
    min-height: 100svh;
    padding: clamp(20px, 4vw, 48px) clamp(20px, 4vw, 48px) calc(clamp(20px, 4vw, 48px) + 8vh);
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 40%, #FBF9F4 0%, #F5F1EA 50%, #ECE5D8 100%);
  }
  .lockup {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.015em;
    font-size: clamp(88px, 17vw, 232px);
  }
  h1 {
    margin: 0;
    font-size: 1em;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
  }
  .o {
    display: inline-block;
    width: 0.54em;
    height: 0.54em;
    vertical-align: -0.025em;
    line-height: 0;
    transform-origin: 50% 50%;
    animation: orbit 18s linear infinite;
  }
  .o svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .o { animation-duration: 60s; } }
  .labs {
    font-size: 0.173em;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #6B645A;
    padding-left: 0.07em;
    margin-top: -0.2em;
    line-height: 1;
  }
  .info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    margin-top: calc(1.3em + 4.8 * max(13px, 0.068em) + 20px);
    padding-left: 0.012em;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: max(13px, 0.068em);
    font-weight: 400;
    line-height: 1.2;
  }
  .soon { letter-spacing: 0.14em; text-transform: uppercase; color: #6B645A; }
  .info a {
    color: #AD3F2B;
    letter-spacing: 0.01em;
    text-decoration: none;
    border-bottom: 1px solid rgba(173, 63, 43, 0.35);
    padding-bottom: 2px;
    transition: border-color 0.2s;
  }
  .info a:hover, .info a:focus-visible { border-bottom-color: #AD3F2B; }
  .info a:focus-visible { outline: 2px solid #AD3F2B; outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <div class="lockup">
    <h1 aria-label="orima"><span class="o" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none"><path d="M16.62 51.26 A33.4 33.4 0 1 1 48.74 83.38" stroke="#1C1915" stroke-width="28" stroke-linecap="round"/><circle cx="21.72" cy="78.28" r="9.5" fill="#E2604C"/></svg></span><span aria-hidden="true">rima</span></h1>
    <span class="labs">Labs</span>
    <div class="info">
      <span class="soon">Coming soon</span>
      <a href="mailto:info@orimalabs.com">info@orimalabs.com</a>
    </div>
  </div>
</main>
</body>
</html>
