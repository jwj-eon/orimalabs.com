<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161821" />
    <link rel="icon" href="./assets/orima-mark.svg" type="image/svg+xml" />
    <title>Page not found | Orima Labs</title>
    <style>
      :root { color: #fbf8f2; background: #161821; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(680px, calc(100% - 40px)); }
      p:first-child { color: #ee7966; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 600px; margin: 18px 0 24px; font-size: clamp(48px, 10vw, 88px); line-height: .96; letter-spacing: -.06em; }
      p { color: #aeb0b5; font-size: 18px; line-height: 1.6; }
      a { display: inline-block; margin-top: 18px; border-bottom: 1px solid #ee7966; padding-bottom: 6px; color: #fbf8f2; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Error 404</p>
      <h1>This page is out of the loop.</h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <a href="./">Return to Orima Labs</a>
    </main>
  </body>
</html>
